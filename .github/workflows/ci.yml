name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The all-models extra is required because tests/test_separator.py imports the
      # backend modules directly (demucs_backend imports torch, inst_hq_4_backend imports audio_separator/onnxruntime).
      - name: Install dependencies
        run: uv sync --extra dev --extra all-models

      - name: Run tests
        run: uv run pytest
